<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: white;
        color: black;
    }
    .dark{
        background-color: black;
        color: white;
    }
</style>
<body>
    <span onclick="toggle()">☀️</span>
    <script>
        function toggle(){
            document.body.classList.toggle("dark");
        }
    </script>
</body>
</html>
